name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # HumConfig is dependency-free and must build on Linux too (CI, cloud agents, contributors).
  config-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test HumConfig
        run: swift test --package-path Packages/HumConfig
      - name: Validate example configs against the schema
        run: swift run --package-path Packages/HumConfig hum-config validate examples/*.json

  apple:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: "platform=macOS"
          - name: iOS
            destination: "generic/platform=iOS Simulator"
    name: Build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Test HumConfig (macOS)
        if: matrix.name == 'macOS'
        run: swift test --package-path Packages/HumConfig
      - name: Build Hum
        run: |
          xcodebuild -project hum-aac-ios.xcodeproj -scheme Hum \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO build

  app-tests:
    runs-on: macos-26
    name: App unit tests (iOS Simulator)
    # A stuck test once held the runner for 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Run HumTests
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E "iPad|iPhone" | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "Simulator: $UDID"
          xcodebuild -project hum-aac-ios.xcodeproj -scheme Hum -destination "id=$UDID" \
            -only-testing:HumTests -resultBundlePath HumTests.xcresult CODE_SIGNING_ALLOWED=NO test &
          XCODEBUILD=$!
          # xcodebuild prints test results only at the end, so a stuck test shows nothing. After 25
          # minutes, print where the test app is stuck and stop.
          for _ in $(seq 300); do kill -0 $XCODEBUILD 2>/dev/null || break; sleep 5; done
          if kill -0 $XCODEBUILD 2>/dev/null; then
            echo "::error::HumTests still running after 25 minutes. Where the test app is stuck:"
            for PID in $(pgrep -f "Hum.app/Hum" || true); do
              sample "$PID" 3 -file "$RUNNER_TEMP/stuck-$PID.txt" >/dev/null 2>&1 || true
              cat "$RUNNER_TEMP/stuck-$PID.txt" 2>/dev/null || true
            done
            kill $XCODEBUILD
            exit 1
          fi
          wait $XCODEBUILD
        env:
          # Skips the tests that need WebKit, which doesn't start reliably here (`.needsWebKit`).
          TEST_RUNNER_HUM_CI: "1"
      - name: Keep the test results when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HumTests-xcresult
          path: HumTests.xcresult
          retention-days: 7
